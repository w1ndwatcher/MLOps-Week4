name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[gs] cml pytest

      # Authenticate Google Cloud
      - name: Setup Google Cloud credentials
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # Pull data and model from DVC remote
      - name: Pull data and model from DVC
        run: |
          dvc pull

      # Run Pytest for validation and evaluation
      - name: Run tests with pytest
        run: |
          pytest -v --junitxml=report.xml > result.log || true

      # Post CML report as comment on PR
      - name: Post CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## ✅ CI Test Report" > report.md
          echo "### Pytest Summary" >> report.md
          tail -n 20 result.log >> report.md
          cml comment create report.md
